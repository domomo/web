der\":\"검색어를 입력해주세요\",\"latestBannerText\":\"최신 소식\",\"highlightBannerText\":\"하이라이트\",\"contactLabel\":\"뉴스룸 문의하기\",\"articleDotLabel\":\"보도자료 · {count}건\",\"browseAgain\":\"다시 둘러보기\",\"noResultText\":\"\u003cspan\u003e{query}\u003c/span\u003e에 대한 결과가 없습니다.\",\"searchResultCountText\":\"총 \u003cspan\u003e{count}\u003c/span\u003e건의 검색결과가 있습니다\",\"noticeBannerLabel\":\"알립니다\",\"bannerCta\":\"자세히 보기\"},\"newsroomDetail\":{\"categoryLabel\":\"보도자료\",\"readingTimeLabel\":\"읽는 시간\",\"minuteUnit\":\"분\",\"shareButtonLabel\":\"공유하기\",\"backToListLabel\":\"목록으로\",\"linkCopiedToast\":\"링크가 복사되었어요\"},\"company\":{\"heroSubtitle\":\"일상 가까이에서 변화를 만들어가는 토스\",\"visionTitle\":\"당연했던 것에 질문을 던지고, 더 나은 해답을 만들어 세상의 기준을 바꾸다\",\"visionDescription\":\"토스는 익숙하고 편한 길보다 변화를 만드는 험한 길을 택합니다. ’안 될 거야’라는 의심 속에서도 멈추지 않고 불가능해 보이는 문제를 끝까지 파고듭니다. 좌절과 실패를 딛고 집념과 몰입으로 기어코 해답을 찾아냅니다. 그 지난함 속에 토스의 유난함이 있습니다. \\n유난한 도전 끝에 찾아낸 해답은 새로운 기준이 되고, 삶을 바꾸며, 시대를 움직입니다.\",\"visionImageAlt\":\"한 획을 그은 변화\",\"historyTitle\":\"세상의 기준을 바꾼 토스의 질문들\",\"groupHeading\":\"일상의 불편함을\\n해결한다는\\n단 하나의 목표를 위해\",\"cultureTitle\":\"일하는 방식이 곧 성공 전략\",\"leadersTitle\":\"토스 팀을 이끌어 가는 사람들\",\"leaderCareer\":\"주요 경력\"},\"fairTrade\":{\"pageTitle\":\"공정거래 자율준수 프로그램\",\"ceoStatementTitle\":\"최고경영자 자율준수 의지 선언\",\"ceoStatementBody\":\"㈜비바리퍼블리카가 토스 앱을 출시한 지 어느덧 10년이 지났습니다.  그동안 우리는 더 많은 사용자와 만나고, 더 많은 파트너와 관계를 맺으며 지속적으로 성장해 왔습니다.\\n\\n이제는 이러한 사업적 성과에 머무르지 않고 “우리가 만들어낸 변화에 책임을 다하는 회사”’,  “믿을 수 있는 회사”로 나아가기 위해 준비를 해야 할 시점입니다.\\n\\n그 첫걸음으로, 지난 2024년 7월 22일 “공정거래 자율준수 프로그램(Compliance Program, CP)”을 도입했습니다.\\n\\nCP란 기업이 공정거래 관련 법규를 스스로 준수하기 위해 자체적으로 제정 및 운영하는 교육, 감독 등의 제반 시스템을 의미합니다. \\n우리는 CP 운영의 실효성 제고를 위해 별도의 독립된 기준을 마련하고 팀원들이 쉽게 이해할 수 있도록 자율준수편람 및 교육을 제공하고 있습니다.\\n공정한 거래 문화가 제대로 작동하는지 수시로 점검하고 개선함은 물론, 다양한 구성원들의 의견에  귀 기울이고 있습니다.\\n\\n대표이사인 저부터 이 기준을 실천하겠습니다. CP가 형식에 그치지 않고 토스의 일하는 방식으로 자리 잡을 수 있도록 필요한 지원과 노력을 아끼지 않겠습니다.\",\"ceoStatementSignature\":\"(주)비바리퍼블리카 대표이사 이승건\"},\"navigation\":{\"nav_dropdown_services_label\":\"서비스\",\"nav_dropdo
